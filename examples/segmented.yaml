# Synthetic example with no access between the two networks.
schema: 1
hostname: segmented-example
hardware:
  machine_id: fedcba9876543210fedcba9876543210 # Synthetic; generate a unique ID once for your device.
  architecture: x86-64
  interfaces:
    wan:
      match:
        mac: 02:00:00:00:01:01
    lan:
      match:
        mac: 02:00:00:00:01:02
uplink:
  interface: wan
  ipv4: dhcp
  ipv6: ra
networks:
  home:
    interface: lan
    addresses:
    - 192.168.10.1/24
    - fd42:1000:1000:10::1/64
    ra: true
    dns: true
    dhcp4:
      pool:
      - 192.168.10.100
      - 192.168.10.200
    vlan: 10
  guest:
    interface: lan
    vlan: 20
    addresses:
    - 172.20.20.1/24
    - fd42:2000:2000:20::1/64
    ra: true
    dns: true
    dhcp4:
      pool:
      - 172.20.20.50
      - 172.20.20.150
services:
  dns:
    enabled: true
  dhcp4:
    enabled: true
access:
  internet:
  - home
  - guest
  between_networks: []
administration:
  networks:
  - home
  authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFhpcHJoRXhhbXBsZU9ubHlOb3RBVXNlcklkZW50aXR5
