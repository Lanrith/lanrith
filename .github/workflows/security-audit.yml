name: Retained release security
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '37 */12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retained-security
  cancel-in-progress: false
jobs:
  assess:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      retained: ${{ steps.scan.outputs.retained }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Install the reviewed scanner and Debian version tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes dpkg
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - id: scan
        name: Reassess retained inventories
        run: python3 scripts/security-audit.py --output "$RUNNER_TEMP/assessments"
      - id: upload
        if: steps.scan.outputs.retained == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assessed-inventories
          path: ${{ runner.temp }}/assessments/
          if-no-files-found: error
          retention-days: 1
  attest:
    if: needs.assess.outputs.retained == 'true'
    needs: assess
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assess.outputs.artifact-id }}
          path: assessments
          merge-multiple: true
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assessments/*/security-assessment.json
      - env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for file in assessments/*/security-assessment.json; do cp "$BUNDLE" "$file.intoto.jsonl"; done
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-assessments
          path: assessments/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact-id }}
          path: assessments
          merge-multiple: true
      - name: Publish immutable freshness evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re,stat,tarfile
          reports=list(pathlib.Path('assessments').glob('*/security-assessment.json'))
          assert reports, 'No retained assessment was received'
          for path in reports:
            assert re.fullmatch(r'[0-9a-f]{12}',path.parent.name)
            assert not path.parent.is_symlink() and path.parent.resolve()==path.parent.absolute()
            report=json.loads(path.read_text())
            record=report['diagnostic_archive']
            assert set(record)=={'name','size','sha256'} and record['name']=='diagnostics.tar.gz'
            assert type(record['size']) is int and 0<record['size']<=64*1024*1024
            assert re.fullmatch(r'[0-9a-f]{64}',record['sha256'])
            archive=path.parent/record['name']
            for asset in (path,path.with_name('security-assessment.json.intoto.jsonl'),archive):
              info=asset.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_nlink==1 and 0<info.st_size<=64*1024*1024
            assert archive.stat().st_size==record['size']
            assert hashlib.sha256(archive.read_bytes()).hexdigest()==record['sha256']
            with tarfile.open(archive,'r|gz') as bundle:
              total=0
              seen=set()
              for member in bundle:
                assert len(seen)<64 and member.name not in seen
                assert member.isfile() and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.+-]{0,99}',member.name)
                seen.add(member.name)
                assert 0<=member.size<=16*1024*1024
                total+=member.size
                assert total<=64*1024*1024
                raw=bundle.extractfile(member).read(16*1024*1024+1)
                assert len(raw)==member.size and hashlib.sha256(raw).hexdigest()==report['diagnostics'][member.name]
              assert seen and seen==set(report['diagnostics'])
          PY
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          for directory in assessments/*; do
            inventory=${directory##*/}
            [[ "$inventory" =~ ^[0-9a-f]{12}$ ]]
            tag="assessment-$stamp-$inventory"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --title "Security assessment $stamp" --prerelease --latest=false \
              --notes "Retained inventory security assessment, diagnostics and explicit support decision." \
              "$directory/security-assessment.json" "$directory/security-assessment.json.intoto.jsonl" \
              "$directory/diagnostics.tar.gz"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
            DIRECTORY="$directory" TAG="$tag" python3 - <<'PYVERIFY'
          import hashlib,json,os,pathlib,subprocess
          directory=pathlib.Path(os.environ['DIRECTORY'])
          names=('security-assessment.json','security-assessment.json.intoto.jsonl','diagnostics.tar.gz')
          expected={name:'sha256:'+hashlib.sha256((directory/name).read_bytes()).hexdigest() for name in names}
          published=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/tags/'+os.environ['TAG']]))
          assert published['immutable'] is True and published['draft'] is False and published['prerelease'] is True
          assert len(published['assets'])==len(expected) and {a['name']:a['digest'] for a in published['assets']}==expected
          PYVERIFY
          done
      - name: Fail the watchdog signal when any retained release is unsafe
        run: |
          python3 - <<'PY'
          import json,pathlib
          reports=[json.loads(p.read_text()) for p in pathlib.Path('assessments').glob('*/security-assessment.json')]
          active=[report for report in reports if report.get('supported',True)]
          assert active and all(report['result']=='pass' for report in active)
          PY
