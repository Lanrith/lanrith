name: Publish immutable qualified release
on:
  workflow_call:
    inputs:
      artifact-id:
        required: true
        type: string
      version:
        required: true
        type: string
permissions:
  contents: read
cache-mode: none
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    outputs:
      verification-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Publish all attested assets through a draft, then verify the immutable result
        run: python3 tools/scripts/publish-release.py
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-verification
          path: verification/publication-verification.json
          if-no-files-found: error
          retention-days: 1
  archive:
    needs: publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/archive-evidence.yml
    with:
      artifact-id: ${{ needs.publish.outputs.verification-id }}
      topic: publication
  complete:
    needs: [publish, archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      AUDIT_TAG: ${{ needs.archive.outputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.publish.outputs.verification-id }}
          path: verification
          merge-multiple: true
      - name: Mark only the verified and durably archived remediation complete
        run: |
          python3 tools/scripts/security-updates.py complete-release --source "$GITHUB_SHA" \
            --candidate verification/publication-verification.json --audit-tag "$AUDIT_TAG" --output "$RUNNER_TEMP/completion.json"
