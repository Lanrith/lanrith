name: Package qualification
on:
  pull_request:
    paths: ['builders/**', 'scripts/**', 'security/**', 'mkosi/**', 'lanrith/**', 'build-inputs.json', '.github/workflows/package-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Unsigned base and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Reserve build disk and install the reviewed scanner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          python3 - <<'PY'
          import os,shutil
          assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 60*1024**3, 'At least 60 GiB free disk is required'
          PY
      - name: Build and assess the complete neutral filesystem
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-base.py --work "$RUNNER_TEMP/lanrith-work" --output "$RUNNER_TEMP/lanrith-output"
      - name: Retain qualification outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-package-qualification
          path: |
            ${{ runner.temp }}/lanrith-output/*.json
            ${{ runner.temp }}/lanrith-output/*.txt
          if-no-files-found: error
          retention-days: 7
