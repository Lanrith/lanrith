name: Propose dependency updates
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Retained release security, Release]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: security-dependency-proposal
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.event != 'pull_request' && ((github.event.workflow_run.name == 'Retained release security' && github.event.workflow_run.conclusion == 'failure') || (github.event.workflow_run.name == 'Release' && github.event.workflow_run.conclusion == 'success'))))
    permissions:
      contents: write
      issues: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/security-proposal.yml
    secrets: inherit
