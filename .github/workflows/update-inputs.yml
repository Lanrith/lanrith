name: Propose dependency updates
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-dependency-proposal
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/security-proposal.yml
    secrets: inherit
