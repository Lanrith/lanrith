name: Security freshness watchdog
on:
  workflow_run:
    workflows: [Retained release security, Release, Propose dependency updates]
    types: [completed]
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check latest failures and security assessment age
        run: python3 scripts/watchdog.py
