name: Qualified base build
on:
  workflow_call:
permissions:
  contents: read
cache-mode: none
jobs:
  check:
    if: github.repository == 'Lanrith/lanrith'
    uses: ./.github/workflows/check.yml
  cache:
    cache-mode: read
    uses: ./.github/workflows/restore-cache.yml
  packages:
    needs: [check, cache]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.stage-upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.value }}
      cache-artifact-id: ${{ steps.cache-upload.outputs.artifact-id }}
      cache-key: ${{ steps.build.outputs.cache-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Install the reviewed scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Reserve disk for the complete source and filesystem build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          python3 - <<'PY'
          import os,shutil
          assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 60*1024**3, 'At least 60 GiB free disk is required'
          PY
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/next-version.py
          cat "$RUNNER_TEMP/lanrith-version" > VERSION
      - name: Receive opaque cache data on the fresh build VM
        if: needs.cache.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.cache.outputs.artifact-id }}
          path: ${{ runner.temp }}/lanrith-cache-candidate
          merge-multiple: true
      - id: build
        name: Compile and assess packages without privileged containers
        env:
          GH_TOKEN: ${{ github.token }}
          LANRITH_REUSABLE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          LANRITH_REUSABLE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CACHE_ARTIFACT: ${{ needs.cache.outputs.artifact-id }}
        run: |
          args=()
          if [[ -n "$CACHE_ARTIFACT" ]]; then args+=(--cache-input "$RUNNER_TEMP/lanrith-cache-candidate"); fi
          python3 scripts/build-base.py --phase packages --work "$RUNNER_TEMP/lanrith-package-work" --output "$RUNNER_TEMP/lanrith-package-output" \
            --cache-output "$RUNNER_TEMP/lanrith-cache-export" "${args[@]}"
      - name: Retain bounded compiler and scanner diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-security-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lanrith-package-work/packages/security-diagnostics/*.json
            ${{ runner.temp }}/lanrith-package-work/packages/security-diagnostics/*.txt
            ${{ runner.temp }}/lanrith-package-work/packages/security-diagnostics/*.stderr
          if-no-files-found: ignore
          retention-days: 1
      - id: cache-upload
        if: steps.build.outputs.cache-ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-build-cache-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lanrith-cache-export/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - id: stage-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-stage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lanrith-package-output/package-stage.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  build:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      actions: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      builder-digest: ${{ steps.builder.outputs.digest }}
      version: ${{ needs.packages.outputs.version }}
      production-qualified: ${{ steps.native.outputs.production-qualified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve disk for image and native qualification
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          python3 - <<'PYTHON'
          import os,shutil
          assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 60*1024**3, 'At least 60 GiB free disk is required'
          PYTHON
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.packages.outputs.artifact-id }}
          path: ${{ runner.temp }}/lanrith-package-stage
          merge-multiple: true
      - id: native
        name: Assemble and qualify the exact package stage on a separate VM
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_VERSION: ${{ needs.packages.outputs.version }}
          LANRITH_REUSABLE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          LANRITH_REUSABLE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          printf '%s\n' "$PLATFORM_VERSION" > VERSION
          python3 scripts/build-base.py --phase image --work "$RUNNER_TEMP/lanrith-work" --output "$RUNNER_TEMP/lanrith-output" \
            --package-stage "$RUNNER_TEMP/lanrith-package-stage/package-stage.tar.gz"
      - id: builder
        name: Publish the exact builder to its immutable digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          image="ghcr.io/lanrith/lanrith-builder:$GITHUB_SHA"
          docker push "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          digest=${digest##*@}
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          rm "$RUNNER_TEMP/lanrith-output/builder.tar"
      - name: Collect the commit-bound change, validation and approval history
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_VERSION: ${{ needs.packages.outputs.version }}
        run: |
          python3 scripts/security-updates.py collect-release --source "$GITHUB_SHA" --version "$PLATFORM_VERSION" \
            --output "$RUNNER_TEMP/lanrith-output/update-record.json"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-base-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lanrith-output/*
          if-no-files-found: error
          retention-days: 1
  attest:
    needs: [build, packages]
    runs-on: ubuntu-24.04
    cache-mode: write-only
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Bind the filesystem, tools and builder into a selection record
        env:
          BUILDER_DIGEST: ${{ needs.build.outputs.builder-digest }}
          PLATFORM_VERSION: ${{ needs.build.outputs.version }}
          SIGNER_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path('release')
          digest=os.environ['BUILDER_DIGEST']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}',digest)
          files={}
          for path in root.iterdir():
              assert path.is_file() and not path.is_symlink()
              assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]{0,191}',path.name)
              with path.open('rb') as stream: files[path.name]=hashlib.file_digest(stream,'sha256').hexdigest()
          selection={'schema':1,'repository':'Lanrith/lanrith','version':'v'+os.environ['PLATFORM_VERSION'],
            'source_commit':os.environ['GITHUB_SHA'],'signer_commit':os.environ['SIGNER_COMMIT'],
            'security_workflow_commit':os.environ['GITHUB_SHA'],
            'manifest_sha256':files['release.json'],'builder':'ghcr.io/lanrith/lanrith-builder',
            'builder_digest':digest[7:],'files':files}
          (root/'selection.json').write_text(json.dumps(selection,sort_keys=True,indent=2)+'\n')
          PY
      # No source checkout, downloaded executable, or caller-provided provenance runs here.
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - id: builder-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/lanrith/lanrith-builder
          subject-digest: ${{ needs.build.outputs.builder-digest }}
      - name: Retain offline verification bundles
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          BUILDER_BUNDLE: ${{ steps.builder-provenance.outputs.bundle-path }}
        run: |
          for file in release/*; do cp "$BUNDLE" "$file.intoto.jsonl"; done
          cp "$BUILDER_BUNDLE" release/builder.intoto.jsonl
      - id: cache-download
        name: Receive the completed build's cache by immutable artifact ID
        if: needs.packages.outputs.cache-artifact-id != '' && needs.build.outputs.production-qualified == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.packages.outputs.cache-artifact-id }}
          path: ${{ runner.temp }}/lanrith-cache-handoff
          merge-multiple: true
      - id: cache-provenance
        if: steps.cache-download.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/lanrith-cache-handoff/*
      - id: cache-bundle
        name: Retain the cache's independent provenance
        if: steps.cache-provenance.outcome == 'success'
        continue-on-error: true
        env:
          CACHE_BUNDLE: ${{ steps.cache-provenance.outputs.bundle-path }}
        run: cp "$CACHE_BUNDLE" "$RUNNER_TEMP/lanrith-cache-handoff/cache.intoto.jsonl"
      - name: Save authenticated acceleration data
        if: steps.cache-bundle.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lanrith-cache-handoff
          key: ${{ needs.packages.outputs.cache-key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attested-base-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [build, attest]
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      issues: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-release.yml
    with:
      artifact-id: ${{ needs.attest.outputs.artifact-id }}
      version: ${{ needs.build.outputs.version }}
