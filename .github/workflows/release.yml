name: Release
on:
  push:
    branches: [main]
    paths: ['lanrith/**', 'scripts/**', 'security/**', 'builders/**', 'mkosi/**', 'tests/**', 'build-inputs.json', 'VERSION', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Lanrith/lanrith' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/build-base.yml
