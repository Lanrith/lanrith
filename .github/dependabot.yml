version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: '04:17'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
      time: '04:17'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
