version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: '04:17'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
      time: '04:17'
      timezone: Etc/UTC
    # Advisory-bound Python fixes use the independently reviewed security proposer.
    # Keep Dependabot alerts, without a competing routine-version PR queue.
    open-pull-requests-limit: 0
