# First boot creates the TPM-encrypted persistent-state volume on the freshly
# copied selected installation disk. The removable factory USB has its own media partition and must
# never be repartitioned; later boots already have /var and skip this unit.
[Unit]
ConditionPathExists=!/dev/disk/by-partlabel/var
ConditionPathExists=!/dev/disk/by-partlabel/lanrith-factory-media

[Service]
Environment=SYSTEMD_LOG_LEVEL=debug
Environment=SYSTEMD_LOG_TARGET=console
TimeoutStartSec=5min
