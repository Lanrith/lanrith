d /var/log/suricata 0750 root adm -
d /var/lib/suricata/rules 0750 root root -
# The immutable rule source is copied by Suricata's ExecStartPre after the
# encrypted /var mount is available.  This placeholder ensures the directory
# exists even while the service is disabled during a recovery boot.
f /var/lib/suricata/rules/suricata.rules 0640 root root -
