[Unit]
RequiresMountsFor=/var/lib/chrony /var/log/chrony

[Service]
# Track Chrony directly instead of relying on the package's forking/PID-file
# protocol. Systemd starts it as _chrony and owns the runtime, state, and log
# directories declared by Debian's unit, including their writable mounts.
# This avoids a privileged startup phase and a second directory owner.
Type=exec
PIDFile=
User=_chrony
Group=_chrony
# Reset inherited sets before adding the two capabilities this configuration
# needs: adjusting the clock and serving NTP on UDP/123. No file capabilities,
# UID/GID transition, raw sockets, or real-time scheduler are required.
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_SYS_TIME CAP_NET_BIND_SERVICE
AmbientCapabilities=
AmbientCapabilities=CAP_SYS_TIME CAP_NET_BIND_SERVICE
NoNewPrivileges=yes
ExecStart=
ExecStart=/usr/sbin/chronyd -n -U -u _chrony -f /etc/chrony/chrony.conf
