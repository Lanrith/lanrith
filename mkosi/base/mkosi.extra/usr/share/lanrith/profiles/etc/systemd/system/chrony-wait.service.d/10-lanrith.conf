[Unit]
# The standalone WAN simulator deliberately has no time-source reachability.
# Chrony remains the LAN NTP authority, but boot must not fail merely because
# the optional package wait-for-sync unit cannot contact an external pool.
# A production WAN release can replace this condition when it provides a
# verified upstream time path.
ConditionPathExists=/etc/lanrith/enable-chrony-wait
