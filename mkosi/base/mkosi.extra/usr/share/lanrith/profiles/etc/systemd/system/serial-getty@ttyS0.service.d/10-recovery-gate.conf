# The first boot must finish recovery-key enrollment before any login prompt.
[Unit]
After=lanrith-recovery-key.service lanrith-serial-idle-watchdog.service
BindsTo=lanrith-serial-idle-watchdog.service
ConditionPathExists=/var/lib/lanrith-factory/recovery-key-enrolled

[Service]
KillMode=control-group
# ttyS0 is not a kernel console, so agetty must set its own baud rate.
ExecStart=
ExecStart=-/sbin/agetty -o '-- \\u' --noclear --local-line 115200 - vt100
