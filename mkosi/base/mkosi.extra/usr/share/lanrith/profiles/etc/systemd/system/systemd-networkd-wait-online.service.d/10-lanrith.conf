# The router has intentionally independent WAN, standalone-LAN, OOB, and
# VPP-owned links. Some of those links may have no carrier during boot, so a
# global network-online wait is not a meaningful health gate. Each service
# that needs a usable path has its own readiness check instead.
[Unit]
ConditionPathExists=/etc/lanrith/enable-network-wait-online
