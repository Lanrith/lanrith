# This router intentionally uses the LUKS2 TPM2 token (PCR 7) for the
# encrypted /var unlock policy.  It does not ship a systemd-pcrlock profile.
# Keep the optional policy generator disabled unless a signed image explicitly
# adds the opt-in marker and accompanying pcrlock profile.
[Unit]
ConditionPathExists=/usr/share/lanrith/enable-pcrlock-policy
