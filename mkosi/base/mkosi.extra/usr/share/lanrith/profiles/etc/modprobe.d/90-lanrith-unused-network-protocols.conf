# The router does not use these protocol families. A package or local process
# must not be able to expand the kernel attack surface by loading one later.
blacklist dccp
install dccp /bin/false
blacklist sctp
install sctp /bin/false
blacklist rds
install rds /bin/false
blacklist tipc
install tipc /bin/false
blacklist can
install can /bin/false
blacklist can_raw
install can_raw /bin/false
blacklist can_bcm
install can_bcm /bin/false
blacklist can_gw
install can_gw /bin/false
blacklist bluetooth
install bluetooth /bin/false
blacklist btusb
install btusb /bin/false
blacklist af_802154
install af_802154 /bin/false
blacklist ieee802154
install ieee802154 /bin/false
blacklist mac802154
install mac802154 /bin/false
blacklist nfc
install nfc /bin/false
