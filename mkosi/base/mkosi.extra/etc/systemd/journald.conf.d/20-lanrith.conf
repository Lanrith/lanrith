[Journal]
# /var is encrypted and persistent, but it must not be allowed to consume the
# volume needed for an A/B update or recovery.  Keep enough history for a
# failed-boot investigation while bounding both persistent and volatile logs.
Storage=persistent
# Serial is for interactive recovery, including while an admin is logged in.
ForwardToConsole=no
ForwardToKMsg=no
ForwardToWall=no
SystemMaxUse=1G
SystemKeepFree=8G
SystemMaxFileSize=64M
RuntimeMaxUse=256M
RuntimeMaxFileSize=32M
MaxRetentionSec=14day
RateLimitIntervalSec=30s
RateLimitBurst=10000
