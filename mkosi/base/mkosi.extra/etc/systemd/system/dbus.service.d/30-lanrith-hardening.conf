[Service]
# Debian gives the message bus CAP_AUDIT_WRITE for kernel audit events. Bound
# it to that existing role and prevent privilege gains through execution.
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_AUDIT_WRITE
AmbientCapabilities=
AmbientCapabilities=CAP_AUDIT_WRITE
NoNewPrivileges=yes
ProtectControlGroups=yes
