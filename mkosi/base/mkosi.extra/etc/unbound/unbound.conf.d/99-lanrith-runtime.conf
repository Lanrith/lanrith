server:
  # Systemd owns the runtime directory and the package daemon drops from its
  # bounded root startup into this account. Avoid a writable /run root entry.
  chroot: ""
  pidfile: "/run/unbound/unbound.pid"

# Lanrith does not expose or consume Unbound's local control socket. Runtime
# changes are delivered only by a newly signed image/configuration.
remote-control:
  control-enable: no
