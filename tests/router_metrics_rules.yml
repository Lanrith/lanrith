  - {series: 'lanrith_router_metrics_collection_success{job="rack",instance="west"}', values: '0x21'}
  - {series: 'lanrith_router_chrony_observation_timestamp_seconds{job="rack",instance="west"}', values: '1 31x6 241+30x6 430 481 517 541 571 601 631'}
