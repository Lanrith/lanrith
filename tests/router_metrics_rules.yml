- name: tcp reachability and scrape success can coexist with missing router data
  interval: 15s
  input_series:
  - {series: 'lanrith_expected_router{job="router",instance="healthy"}', values: '1x2'}
  - {series: 'lanrith_expected_router{job="router",instance="missing"}', values: '1x2'}
  - {series: 'up{job="router",instance="healthy"}', values: '1x2'}
  - {series: 'up{job="router",instance="missing"}', values: '1x2'}
  - {series: 'probe_success{job="tcp",instance="missing"}', values: '1x2'}
  - {series: 'node_boot_time_seconds{job="router",instance="healthy"}', values: '0x2'}
  - {series: 'node_boot_time_seconds{job="router",instance="missing"}', values: '0x2'}
  - {series: 'lanrith_router_metrics_collection_timestamp_seconds{job="router",instance="healthy"}', values: '0+15x2'}
