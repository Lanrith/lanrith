  - series: lanrith_expected_router{job="router",instance="a",directory="enabled",ntp="enabled"}
    values: 1x18
  - series: up{job="router",instance="a"}
    values: 1x18
  - series: node_boot_time_seconds{job="router",instance="a"}
    values: 1x11 195x6
  - series: lanrith_router_metrics_collection_success{job="router",instance="a"}
    values: 1x8 0 1x8
  - series: lanrith_router_metrics_collection_timestamp_seconds{job="router",instance="a"}
    values: 1x8 135 150 165 180 180 210 900 240 255 270
  - series: lanrith_router_metrics_query_success{job="router",instance="a",collector="directory"}
    values: 1x16 0 1
  - series: lanrith_router_metrics_query_success{job="router",instance="a",collector="chrony"}
    values: 1x18
  - series: lanrith_router_directory_tls_verified{job="router",instance="a"}
    values: 1x9 0 1x7
  - series: lanrith_router_directory_tls_observation_timestamp_seconds{job="router",instance="a"}
    values: 1+15x18
  - series: lanrith_router_chrony_observation_timestamp_seconds{job="router",instance="a"}
    values: 1+15x18
  - series: lanrith_router_chrony_synchronised{job="router",instance="a"}
    values: 1x18
  - series: lanrith_router_directory_tls_certificate_not_after_seconds{job="router",instance="a"}
    values: 800x10 165 800x6
  - series: lanrith_router_client_inventory_complete{job="router",instance="a"}
    values: 1x9 0 1x7
  - series: lanrith_router_client_inventory_collection_timestamp_seconds{job="router",instance="a"}
    values: 1+15x18
  - series: lanrith_router_client_neighbor_info{job="router",instance="a",network="clients",interface="lan",address="192.0.2.1",mac="02:00:00:00:00:01",family="ipv4"}
    values: 1x18
  - series: lanrith_attachment_info{job="router",instance="a",network="clients",interface="lan",placement="floor-1"}
    values: 1x18
  - series: lanrith_router_client_neighbor_info{job="router",instance="a",network="unknown",interface="other",address="192.0.2.1",mac="02:00:00:00:00:01",family="ipv4"}
    values: 1x18
  - series: lanrith_router_client_neighbor_info{job="router",instance="a",network="ambiguous",interface="vlan",address="192.0.2.1",mac="02:00:00:00:00:01",family="ipv4"}
    values: 1x18
  - series: lanrith_attachment_info{job="router",instance="a",network="ambiguous",interface="vlan",placement="floor-1"}
    values: 1x18
  - series: lanrith_attachment_info{job="router",instance="a",network="ambiguous",interface="vlan",placement="floor-2"}
    values: 1x18
  - series: lanrith_expected_router{job="router",instance="missing",directory="enabled"}
    values: 1x18
  - series: lanrith_expected_router{job="router",instance="no-tls",directory="disabled"}
    values: 1x18
  promql_expr_test:
  - expr: count(lanrith:collection_current{instance="a"})
    eval_time: 15s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(lanrith:collection_current{instance="a"})
    eval_time: 120s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(lanrith:collection_current{instance="a"})
    eval_time: 135s
    exp_samples: []
  - expr: count(lanrith:collection_current{instance="a"})
    eval_time: 150s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(lanrith:collection_current{instance="a"})
    eval_time: 180s
    exp_samples: []
  - expr: count(lanrith:collection_current{instance="a"})
    eval_time: 195s
    exp_samples: []
  - expr: count(lanrith:collection_current{instance="a"})
    eval_time: 210s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(lanrith:collection_current{instance="a"})
    eval_time: 225s
    exp_samples: []
  - expr: count(lanrith:collection_current{instance="a"})
    eval_time: 240s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(lanrith:collection_current{instance="a"})
    eval_time: 270s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(lanrith:directory_tls_healthy{instance="a"})
    eval_time: 15s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(lanrith:directory_tls_healthy{instance="a"})
    eval_time: 150s
    exp_samples: []
  - expr: count(lanrith:directory_tls_healthy{instance="a"})
    eval_time: 165s
    exp_samples: []
  - expr: count(lanrith:directory_tls_healthy{instance="a"})
    eval_time: 210s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(lanrith:directory_tls_healthy{instance="a"})
    eval_time: 270s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(lanrith:chrony_synchronised == 1)
    eval_time: 15s
    exp_samples:
    - labels: '{}'
      value: 2
  - expr: count(lanrith:enrollable_neighbor{placement="floor-1"})
    eval_time: 15s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(lanrith:enrollable_neighbor)
    eval_time: 150s
    exp_samples: []
  - expr: count(lanrith:enrollable_neighbor{network!="clients"})
    eval_time: 15s
    exp_samples: []
  - expr: count(ALERTS{alertname="LanrithDirectoryTLSUnhealthy",alertstate="firing",instance="b"})
    eval_time: 150s
    exp_samples: []
  - expr: count(ALERTS{alertname="LanrithDirectoryTLSUnhealthy",alertstate="firing",instance="a"})
    eval_time: 15s
    exp_samples: []
  - expr: count(ALERTS{alertname="LanrithDirectoryTLSUnhealthy",alertstate="firing",instance="a"})
