    - {labels: 'lanrith:chrony_state{job="rack",instance="west"}', value: 1}
  - expr: lanrith:chrony_state{instance="west"}
    eval_time: 375s
    exp_samples:
    - {labels: 'lanrith:chrony_state{job="rack",instance="west"}', value: -1}
  - expr: lanrith:chrony_accuracy_state
    eval_time: 390s
    exp_samples:
    - {labels: 'lanrith:chrony_accuracy_state{job="rack",instance="west"}', value: 1}
  # Lost scrape, pre-boot observation, restored scrape, future observation, daemon loss.
  - expr: lanrith:chrony_state{instance="west"}
    eval_time: 420s
    exp_samples:
    - {labels: 'lanrith:chrony_state{job="rack",instance="west"}', value: -1}
  - expr: lanrith:chrony_state{instance="west"}
    eval_time: 450s
    exp_samples:
    - {labels: 'lanrith:chrony_state{job="rack",instance="west"}', value: -1}
  - expr: lanrith:chrony_state{instance="west"}
    eval_time: 480s
    exp_samples:
    - {labels: 'lanrith:chrony_state{job="rack",instance="west"}', value: 1}
  - expr: lanrith:chrony_state{instance="west"}
    eval_time: 510s
    exp_samples:
    - {labels: 'lanrith:chrony_state{job="rack",instance="west"}', value: -1}
  - expr: lanrith:chrony_accuracy_state
    eval_time: 540s
    exp_samples:
    - {labels: 'lanrith:chrony_accuracy_state{job="rack",instance="west"}', value: -1}
  - expr: lanrith:chrony_accuracy_state
    eval_time: 570s
    exp_samples:
    - {labels: 'lanrith:chrony_accuracy_state{job="rack",instance="west"}', value: 1}
  - expr: lanrith:chrony_state{instance="west"}
    eval_time: 600s
    exp_samples:
