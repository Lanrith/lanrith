  - series: up{job="router",instance="b"}
    values: 1x18
  - series: node_boot_time_seconds{job="router",instance="b"}
    values: 1x18
  - series: lanrith_router_metrics_collection_success{job="router",instance="b"}
    values: 1x18
  - series: lanrith_router_metrics_collection_timestamp_seconds{job="router",instance="b"}
    values: 1+15x18
  - series: lanrith_router_metrics_query_success{job="router",instance="b",collector="directory"}
    values: 1x18
  - series: lanrith_router_metrics_query_success{job="router",instance="b",collector="chrony"}
    values: 1x18
  - series: lanrith_router_directory_tls_verified{job="router",instance="b"}
    values: 1x18
  - series: lanrith_router_directory_tls_observation_timestamp_seconds{job="router",instance="b"}
    values: 1+15x18
  - series: lanrith_router_chrony_observation_timestamp_seconds{job="router",instance="b"}
    values: 1+15x18
  - series: lanrith_router_chrony_synchronised{job="router",instance="b"}
