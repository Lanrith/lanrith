# A healthy scrape without any TLS families must still identify the affected
# enabled router. A disabled peer and a failed collector with no queries do
# not receive a probe diagnosis.
- interval: 15s
  input_series:
  - {series: 'lanrith_expected_router{job="router",instance="empty-tls",directory="enabled"}', values: '1x2'}
  - {series: 'lanrith_expected_router{job="router",instance="disabled",directory="disabled"}', values: '1x2'}
  - {series: 'up{job="router",instance="empty-tls"}', values: '1x2'}
  - {series: 'up{job="router",instance="disabled"}', values: '1x2'}
  - {series: 'node_boot_time_seconds{job="router",instance="empty-tls"}', values: '0x2'}
  - {series: 'node_boot_time_seconds{job="router",instance="disabled"}', values: '0x2'}
  - {series: 'lanrith_router_metrics_collection_timestamp_seconds{job="router",instance="empty-tls"}', values: '0+15x2'}
  - {series: 'lanrith_router_metrics_collection_timestamp_seconds{job="router",instance="disabled"}', values: '0+15x2'}
  - {series: 'lanrith_router_metrics_collection_success{job="router",instance="empty-tls"}', values: '1 1 0'}
  - {series: 'lanrith_router_metrics_collection_success{job="router",instance="disabled"}', values: '1x2'}
  - {series: 'lanrith_router_metrics_query_success{job="router",instance="empty-tls",collector="directory"}', values: '_ 1 stale'}
  alert_rule_test:
  - eval_time: 0s
    alertname: LanrithDirectoryTLSProbeStale
    exp_alerts: [{exp_labels: {job: router, instance: empty-tls, directory: enabled}}]
  - eval_time: 15s
    alertname: LanrithDirectoryTLSProbeStale
    exp_alerts: [{exp_labels: {job: router, instance: empty-tls, directory: enabled}}]
  - eval_time: 30s
    alertname: LanrithDirectoryTLSProbeStale
    exp_alerts: []
- interval: 15s
  input_series:
  - {series: 'lanrith_expected_router{job="router",instance="exporter",logs="enabled"}', values: '1x24'}
  - {series: 'lanrith_expected_router{job="router",instance="local",logs="disabled"}', values: '1x24'}
  - {series: 'up{job="router",instance="exporter"}', values: '1x24'}
  - {series: 'node_boot_time_seconds{job="router",instance="exporter"}', values: '0x24'}
  - {series: 'lanrith_router_metrics_collection_timestamp_seconds{job="router",instance="exporter"}', values: '0+15x24'}
  - {series: 'lanrith_router_metrics_query_success{job="router",instance="exporter",collector="alloy"}', values: '1x23 0'}
  - {series: 'lanrith_router_alloy_queue_capacity_bytes{job="router",instance="exporter"}', values: '67108864x24'}
  - {series: 'lanrith_router_alloy_queue_size_bytes{job="router",instance="exporter"}', values: '0+100x21 0x2'}
  - {series: 'lanrith_router_alloy_enqueue_failed_records_total{job="router",instance="exporter"}', values: '0x19 1x4'}
  - {series: 'lanrith_router_alloy_send_failed_records_total{job="router",instance="exporter"}', values: '0x21 1x2'}
  alert_rule_test:
  - {eval_time: 15s, alertname: LanrithLogEnqueueFailures, exp_alerts: []}
  - {eval_time: 15s, alertname: LanrithLogSendFailures, exp_alerts: []}
  - {eval_time: 15s, alertname: LanrithLogQueueGrowing, exp_alerts: []}
  - {eval_time: 315s, alertname: LanrithLogQueueGrowing, exp_alerts: [{exp_labels: {job: router, instance: exporter}}]}
  - {eval_time: 315s, alertname: LanrithLogEnqueueFailures, exp_alerts: [{exp_labels: {job: router, instance: exporter}}]}
  - {eval_time: 330s, alertname: LanrithLogSendFailures, exp_alerts: [{exp_labels: {job: router, instance: exporter}}]}
