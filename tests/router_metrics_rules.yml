- interval: 30s
  input_series:
  - {series: 'lanrith_expected_router{job="rack",instance="west",ntp="enabled",chrony_accuracy="enabled"}', values: '1x21'}
  - {series: 'lanrith_expected_router{job="rack",instance="east",ntp="enabled"}', values: '1x21'}
