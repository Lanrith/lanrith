    eval_time: 165s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="LanrithDirectoryTLSUnhealthy",alertstate="firing",instance="a"})
    eval_time: 210s
    exp_samples: []
  - expr: count(ALERTS{alertname="LanrithDirectoryTLSUnhealthy",alertstate="firing",instance="missing"})
    eval_time: 15s
    exp_samples: []
  - expr: count(ALERTS{alertname="LanrithDirectoryTLSUnhealthy",alertstate="firing",instance="no-tls"})
    eval_time: 15s
    exp_samples: []
  - expr: 'count(lanrith:directory_tls_healthy{instance="a"})'
    eval_time: 255s
    exp_samples: []
# The scraper keeps returning 200 while the source timestamp stops advancing.
- interval: 30s
  input_series:
  - series: 'lanrith_expected_router{job="router",instance="held"}'
    values: '1x7'
  - series: 'up{job="router",instance="held"}'
    values: '1x7'
  - series: 'node_boot_time_seconds{job="router",instance="held"}'
    values: '1x7'
  - series: 'lanrith_router_metrics_collection_success{job="router",instance="held"}'
    values: '1x5 0 1'
  - series: 'lanrith_router_metrics_collection_timestamp_seconds{job="router",instance="held"}'
    values: '5x5 180 210'
  promql_expr_test:
  - expr: 'count(lanrith:collection_current)'
    eval_time: 120s
    exp_samples: [{labels: '{}', value: 1}]
  - expr: 'count(lanrith:collection_current)'
    eval_time: 150s
    exp_samples: []
  - expr: 'count(lanrith:collection_current)'
    eval_time: 180s
    exp_samples: []
  - expr: 'count(lanrith:collection_current)'
    eval_time: 210s
    exp_samples: [{labels: '{}', value: 1}]
# Idle directory, then exhausted freshness before the host sample itself expires.
- interval: 30s
  input_series:
  - {series: 'lanrith_expected_router{job="router",instance="policy"}', values: '1x4'}
  - {series: 'up{job="router",instance="policy"}', values: '1x4'}
  - {series: 'node_boot_time_seconds{job="router",instance="policy"}', values: '0x4'}
  - {series: 'lanrith_router_metrics_collection_success{job="router",instance="policy"}', values: '1x4'}
  - {series: 'lanrith_router_metrics_collection_timestamp_seconds{job="router",instance="policy"}', values: '1+30x4'}
  - {series: 'lanrith_router_policy_status_query_timestamp_seconds{job="router",instance="policy"}', values: '6x3 120'}
  - {series: 'lanrith_router_policy_directory_age_seconds{job="router",instance="policy"}', values: '6x4'}
  - {series: 'lanrith_router_policy_apply_age_seconds{job="router",instance="policy"}', values: '1x4'}
  - {series: 'lanrith_router_metrics_query_success{job="router",instance="policy",collector="policy_status"}', values: '1x4'}
  - {series: 'lanrith_router_policy_helper_ready{job="router",instance="policy"}', values: '1x4'}
  - {series: 'lanrith_router_policy_last_application{job="router",instance="policy"}', values: '1x4'}
  promql_expr_test:
  - expr: 'count(lanrith:policy_application_fresh)'
    eval_time: 60s
    exp_samples: [{labels: '{}', value: 1}]
  - expr: 'count(lanrith:policy_application_fresh)'
    eval_time: 90s
    exp_samples: []
  - expr: 'count(lanrith:policy_application_fresh)'
    eval_time: 120s
    exp_samples: [{labels: '{}', value: 1}]
# A declared attachment can be complete even when it has no neighbor detail.
- interval: 30s
  input_series:
  - {series: 'lanrith_expected_router{job="router",instance="empty"}', values: '1x2'}
  - {series: 'up{job="router",instance="empty"}', values: '1x2'}
  - {series: 'node_boot_time_seconds{job="router",instance="empty"}', values: '1x2'}
  - {series: 'lanrith_router_metrics_collection_success{job="router",instance="empty"}', values: '1x2'}
  - {series: 'lanrith_router_metrics_collection_timestamp_seconds{job="router",instance="empty"}', values: '1+30x2'}
  - {series: 'lanrith_router_client_inventory_complete{job="router",instance="empty"}', values: '1 0 1'}
  - {series: 'lanrith_router_client_inventory_collection_timestamp_seconds{job="router",instance="empty"}', values: '1 1 60'}
  - {series: 'lanrith_attachment_info{job="router",instance="empty",network="lan",interface="en0",placement="west"}', values: '1x2'}
  promql_expr_test:
  - expr: 'count(lanrith:reconcilable_attachment)'
    eval_time: 30s
    exp_samples: []
  - expr: 'count(lanrith:reconcilable_attachment)'
    eval_time: 60s
    exp_samples: [{labels: '{}', value: 1}]
  - expr: 'count(lanrith:enrollable_neighbor)'
    eval_time: 60s
    exp_samples: []
- interval: 15s
  input_series:
  - series: lanrith_expected_router{job="router",instance="wan",ids="enabled"}
    values: 1x12
  - series: up{job="router",instance="wan"}
    values: 1x12
  - series: node_boot_time_seconds{job="router",instance="wan"}
    values: 1x12
  - series: lanrith_router_metrics_collection_success{job="router",instance="wan"}
    values: 1x12
  - series: lanrith_router_metrics_collection_timestamp_seconds{job="router",instance="wan"}
    values: 1+15x12
  - series: lanrith_router_metrics_query_success{job="router",instance="wan",collector="ids_capture"}
    values: 1x12
  - series: lanrith_router_ids_stats_fresh{job="router",instance="wan"}
    values: 1x12
  - series: lanrith_router_ids_stats_timestamp_seconds{job="router",instance="wan"}
    values: 1x12
  - series: lanrith_router_ids_kernel_drops_total{job="router",instance="wan"}
    values: 0 0 0 3 3x8
  alert_rule_test:
  - eval_time: 30s
    alertname: LanrithIDSKernelDrops
    exp_alerts: []
  - eval_time: 60s
    alertname: LanrithIDSKernelDrops
    exp_alerts:
    - exp_labels: {job: router, instance: wan}
  - eval_time: 60s
    alertname: LanrithIDSCaptureUnavailable
    exp_alerts: []
  - eval_time: 90s
    alertname: LanrithIDSCaptureUnavailable
    exp_alerts:
    - exp_labels: {job: router, instance: wan, ids: enabled}
# The TLS probe stops while collection and scraping continue. A fresh negative
# and a later success separate transport from stale evidence. Anchor rotation
# is observable across both, and the helper ages independently of reader polls.
- interval: 15s
  input_series:
  - {series: 'lanrith_expected_router{job="router",instance="dir",directory="enabled",policy="enforce"}', values: '1x12'}
  - {series: 'up{job="router",instance="dir"}', values: '1x9 0 1x1'}
  - {series: 'node_boot_time_seconds{job="router",instance="dir"}', values: '0x12'}
  - {series: 'lanrith_router_metrics_collection_success{job="router",instance="dir"}', values: '1x6 0 1x4'}
  - {series: 'lanrith_router_metrics_collection_timestamp_seconds{job="router",instance="dir"}', values: '0+15x12'}
  - {series: 'lanrith_router_metrics_query_success{job="router",instance="dir",collector="directory"}', values: '1x6 0 1x4'}
  - {series: 'lanrith_router_directory_tls_observation_timestamp_seconds{job="router",instance="dir"}', values: '0x6 stale 120+15x4'}
  - {series: 'lanrith_router_directory_tls_verified{job="router",instance="dir"}', values: '1x6 stale 0 1x3'}
  - {series: 'lanrith_router_directory_tls_certificate_not_after_seconds{job="router",instance="dir"}', values: '200000x6 stale 0 200000x3'}
  - {series: 'lanrith_router_directory_tls_endpoints_total{job="router",instance="dir"}', values: '1x11 2'}
  - {series: 'lanrith_directory_issued_leaf_not_after_seconds{job="router",instance="dir"}', values: '200000x8 220000x3'}
  - {series: 'lanrith_router_metrics_query_success{job="router",instance="dir",collector="directory_trust"}', values: '1x6 0 1x4'}
  - {series: 'lanrith_router_directory_trust_certificate_not_after_seconds{job="router",instance="dir",sha256="retiring"}', values: '86400x6 stale'}
  - {series: 'lanrith_router_directory_trust_certificate_not_after_seconds{job="router",instance="dir",sha256="renewed"}', values: '40000000x6 stale 40000000x4'}
  - {series: 'lanrith_router_metrics_query_success{job="router",instance="dir",collector="policy_status"}', values: '1x12'}
  - {series: 'lanrith_router_policy_status_query_timestamp_seconds{job="router",instance="dir"}', values: '0+15x12'}
  - {series: 'lanrith_router_policy_last_application{job="router",instance="dir"}', values: '0 1x11'}
  - {series: 'lanrith_router_policy_helper_ready{job="router",instance="dir"}', values: '1x12'}
  - {series: 'lanrith_router_policy_directory_age_seconds{job="router",instance="dir"}', values: '_ 15+15x7 0+15x3'}
  - {series: 'lanrith_router_policy_apply_age_seconds{job="router",instance="dir"}', values: '_ 10+15x7 0+15x3'}
  - {series: 'lanrith_router_metrics_query_success{job="router",instance="dir",collector="policy_reader"}', values: '1x12'}
  - {series: 'lanrith_router_policy_reader_attempt_timestamp_seconds{job="router",instance="dir"}', values: '0+15x12'}
  - {series: 'lanrith_router_policy_reader_latest_attempt{job="router",instance="dir",outcome="applied"}', values: '_ 1 stale _ _ _ _ _ _ 1x3'}
  - {series: 'lanrith_router_policy_reader_latest_attempt{job="router",instance="dir",outcome="collection_failed"}', values: '_ _ 1 stale'}
  - {series: 'lanrith_router_policy_reader_latest_attempt{job="router",instance="dir",outcome="submission_failed"}', values: '_ _ _ 1 stale'}
  - {series: 'lanrith_router_policy_reader_latest_attempt{job="router",instance="dir",outcome="rejected"}', values: '_ _ _ _ 1 stale'}
  - {series: 'lanrith_router_policy_reader_latest_attempt{job="router",instance="dir",outcome="shadow"}', values: '_ _ _ _ _ 1x3 stale'}
  promql_expr_test:
  - expr: 'count(ALERTS{alertname="LanrithDirectoryTLSProbeStale",instance="dir"})'
    eval_time: 90s
    exp_samples: []
  - expr: 'count(ALERTS{alertname="LanrithDirectoryTLSUnhealthy",instance="dir"})'
    eval_time: 90s
    exp_samples: []
  - expr: 'count(ALERTS{alertname="LanrithDirectoryTLSProbeStale",instance="dir"})'
    eval_time: 105s
    exp_samples: [{labels: '{}', value: 1}]
