  - {series: 'lanrith_router_chrony_clock_error_bound_seconds{job="rack",instance="west"}', values: '0.01x7 0.2 0.1x8 stale 0.05x2'}
  promql_expr_test:
  # Two routers, including an unrelated west collector failure.
  - expr: lanrith:chrony_state
    eval_time: 30s
    exp_samples:
    - {labels: 'lanrith:chrony_state{job="rack",instance="west"}', value: 1}
    - {labels: 'lanrith:chrony_state{job="rack",instance="east"}', value: 0}
  - expr: lanrith:chrony_accuracy_state
    eval_time: 30s
    exp_samples:
    - {labels: 'lanrith:chrony_accuracy_state{job="rack",instance="west"}', value: 1}
  # Same external clock state, old reference at 120s and large uncertainty at 240s.
  - expr: lanrith:chrony_accuracy_state
    eval_time: 120s
    exp_samples:
    - {labels: 'lanrith:chrony_accuracy_state{job="rack",instance="west"}', value: 0}
  - expr: lanrith:chrony_accuracy_state
    eval_time: 240s
    exp_samples:
    - {labels: 'lanrith:chrony_accuracy_state{job="rack",instance="west"}', value: 0}
  # Observer held, then a new observation. The collector separately stops and resumes.
  - expr: lanrith:chrony_state
    eval_time: 225s
    exp_samples:
    - {labels: 'lanrith:chrony_state{job="rack",instance="west"}', value: -1}
    - {labels: 'lanrith:chrony_state{job="rack",instance="east"}', value: 0}
  - expr: lanrith:chrony_state{instance="west"}
    eval_time: 240s
